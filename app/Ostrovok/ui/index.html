<!-- one black "goo" layer draws the island, the split-off cell and the trash so they part like living cells -->
<div class="goo" aria-hidden="true"><div class="blob" id="gMain"></div><div class="blob cg" id="gCell"></div><div class="blob trash-geo" id="gTrash"></div></div>

<div id="hot"></div>
<div class="island" id="island" data-state="collapsed">
  <div class="clip">

    <div class="layer l-col" id="col">
      <div class="cl-left"><div class="cover mini only-media" data-cover></div><span class="cl-apps" id="c-apps"></span></div>
      <div class="cl-mid"><span data-b="time" id="c-time"></span><span class="timer-chip" id="c-timer" hidden><svg class="ic"><use href="#g-timer"/></svg><b></b></span></div>
      <div class="cl-right"><span class="tg-badge" id="c-tg" title="Непрочитанные в Telegram" hidden><svg class="ic"><use href="#g-send"/></svg><b></b></span><span class="eq only-playing"><i></i><i></i><i></i><i></i><i></i></span><span class="tchip"><svg class="ic" id="c-ic"><use href="#g-therm"/></svg><b data-b="chip"></b></span></div>
    </div>

    <div class="layer l-exp" id="exp">
      <div class="xt stg" style="--i:0">
        <div class="clock rc" data-cell="cal" title="Правый клик — календарь, погода и таймер"><b data-b="time"></b><span data-b="date"></span></div>
        <div class="xt-mid">
          <div class="hm rc only-media" data-drag="player" data-cell="player" title="Правый клик — большой плеер">
            <div class="cover" data-cover></div>
            <span class="eq"><i></i><i></i><i></i><i></i><i></i></span>
            <span class="hm-t"><b data-b="trk"></b><span class="hm-a"> · <span data-b="art"></span></span></span>
            <button class="ib" data-act="play" title="Пауза / воспроизведение"><svg class="ic i-pause"><use href="#g-pause"/></svg><svg class="ic i-play"><use href="#g-play"/></svg></button>
            <button class="ib" data-act="next" id="b-next" title="Следующий трек"><svg class="ic"><use href="#g-next"/></svg></button>
          </div>
        </div>
        <button class="ib sq" data-act="settings" title="Параметры Windows"><svg class="ic"><use href="#g-gear"/></svg></button>
        <button class="ib sq" data-click-cell="power" title="Сон, перезагрузка, выключение"><svg class="ic"><use href="#g-power"/></svg></button>
      </div>

      <div class="mid stg" style="--i:1">
        <div class="wcol rc" data-cell="favs" title="Правый клик — изменить избранное">
          <div class="cap">Избранное</div>
          <div class="wheel" id="wheel"><div class="w-deco"></div><div class="w-items"></div><div class="w-empty" hidden>Закрепите приложения на панели задач, и они появятся здесь</div></div>
        </div>
        <div class="wl">
          <div class="cap">Открытые окна</div>
          <div class="wl-list" id="wins"></div>
        </div>
      </div>

      <div class="xb stg" style="--i:2">
        <button class="search-wide" data-click-cell="search" title="Поиск"><svg class="ic"><use href="#g-search"/></svg><span>Поиск приложений и файлов</span></button>
        <span class="divd"></span>
        <div class="tgs">
          <button class="tg" data-act="wifi" data-cell="wifi" id="t-wifi" title="Wi-Fi · правый клик — сети" hidden><svg class="ic"><use href="#g-wifi"/></svg></button>
          <button class="tg" data-act="bt" data-cell="bt" id="t-bt" title="Bluetooth · правый клик — устройства" hidden><svg class="ic"><use href="#g-bt"/></svg></button>
          <button class="tg mute" data-act="mute" data-cell="sound" id="t-mute" title="Без звука · правый клик — звук"><svg class="ic"><use href="#g-mute"/></svg></button>
        </div>
        <label class="vol" data-cell="sound" title="Правый клик — устройства и микшер"><svg class="ic"><use href="#g-vol"/></svg><input class="rng" type="range" id="vol" min="0" max="100" value="50" aria-label="Громкость"><b id="vol-n">50</b></label>
        <div class="cpu-mini rc" data-cell="cpu" title="Правый клик — что нагружает компьютер">
          <div class="gauge"><svg viewBox="0 0 64 64"><circle class="g-tr" cx="32" cy="32" r="26"/><circle class="g-val" cx="32" cy="32" r="26"/></svg></div>
          <div><b data-b="g-main"></b><span data-b="g-sub"></span></div>
        </div>
        <div class="cpu-mini gpu-mini rc" data-cell="cpu" id="gpu-mini" title="Загрузка видеокарты · правый клик — подробнее" hidden>
          <div class="gauge"><svg viewBox="0 0 64 64"><circle class="g-tr" cx="32" cy="32" r="26"/><circle class="g-val" id="gpu-ring" cx="32" cy="32" r="26"/></svg></div>
          <div><b data-b="gpu-main"></b><span>видеокарта</span></div>
        </div>
      </div>
    </div>

    <div class="layer l-evt" id="evt"></div>

    <!-- the smallest form, after a while without the pointer: only time, music, CPU and GPU -->
    <div class="layer l-mini" id="mini">
      <span class="eq only-playing"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="m-time"><span data-b="time" class="m-clock"></span><span class="timer-chip m-timer" hidden><svg class="ic"><use href="#g-timer"/></svg><b></b></span></span>
      <span class="mchip m-cpu"><svg class="ic"><use href="#g-cpu"/></svg><b data-b="cpu-pct"></b></span>
      <span class="mchip m-gpu" hidden><svg class="ic"><use href="#g-gpu"/></svg><b data-b="gpu-pct"></b></span>
    </div>
  </div>
</div>

<div class="cell cg" id="cell"><div class="cc" id="cc"></div></div>
<div class="trash trash-geo" id="trash" aria-hidden="true">
  <svg class="bin" viewBox="0 0 24 24"><g class="lid"><path d="M4 6.5h16"/><path d="M9.5 6.5V4.8a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.7"/></g><path d="M6 6.5l1 12.2a2 2 0 0 0 2 1.8h6a2 2 0 0 0 2-1.8l1-12.2"/><path d="M10 10.5v6M14 10.5v6"/></svg>
</div>
<div class="ghost" id="ghost" hidden></div>

<script src="app.js"></script>
<script src="cells.js"></script>
</body>
</html>
